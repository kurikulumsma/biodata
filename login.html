<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Biodata Kegiatan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1A5FB4; --blue-dark: #0D4A96;
  --red: #C0392B; --red-light: #FEF2F2;
  --gray-bg: #F1F3F7; --gray-border: #E2E5ED; --gray-text: #6B7280;
  --text: #111827; --text-soft: #374151; --white: #FFFFFF;
  --radius: 8px;
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c1e3c; color: var(--text); min-height: 100vh; font-size: 14px; }
#particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }
.login-card { background: var(--white); border-radius: 18px; border: 1px solid var(--gray-border); padding: 44px 40px; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
.login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
.login-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--gray-text); margin-bottom: 28px; }
.login-card label { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-soft); text-transform: uppercase; margin-bottom: 6px; }
.login-card input { width: 100%; height: 44px; border: 1.5px solid var(--gray-border); border-radius: var(--radius); padding: 0 14px; font-family: inherit; font-size: 14px; background: #FAFBFC; margin-bottom: 16px; color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; }
.login-card input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,95,180,0.1); background: white; outline: none; }
.btn-login { width: 100%; height: 46px; background: var(--blue); color: white; border: none; border-radius: var(--radius); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-login:hover { background: var(--blue-dark); }
.btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
.login-err { font-size: 12.5px; color: var(--red); background: var(--red-light); border: 1px solid #FECACA; border-radius: 6px; padding: 8px 12px; margin-top: -8px; margin-bottom: 14px; display: none; }
.login-err.show { display: block; }
@media (max-width: 480px) { .login-card { padding: 32px 24px; } }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="logosma.png" alt="Logo SMA" style="height:52px;width:auto;object-fit:contain;">
    </div>
    <div class="login-title">Selamat datang</div>
    <div class="login-sub">Manajemen kegiatan Direktorat Sekolah Menengah Atas</div>
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="Masukkan username" autocomplete="off">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••">
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" onclick="doLogin()" id="btnLogin">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Masuk
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lusytejskqevwyyffeue.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1c3l0ZWpza3Fldnd5eWZmZXVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzUyODksImV4cCI6MjA5MTcxMTI4OX0.LKCfdnlB8TQTeB7NuZ1DXwSkCI9DK3WlD4xk-jzUTPU';

// Kalau sudah punya session yang valid, langsung redirect
window.onload = () => {
  const saved = localStorage.getItem('adminUser');
  if (saved) {
    try {
      const user = JSON.parse(saved);
      if (user && user.role) { redirectByRole(user.role); return; }
    } catch { localStorage.clear(); }
  }
};

function redirectByRole(role) {
  // Semua role masuk ke admin.html, sidebar dan konten disesuaikan di sana
  window.location.href = 'admin.html';
}

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('btnLogin');

  errEl.classList.remove('show');
  if (!username || !pass) {
    errEl.textContent = 'Isi username dan password.';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;animation:spin 1s linear infinite"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg> Memeriksa...';

  try {
    const hash = await sha256(pass);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/admin_users?username=eq.${encodeURIComponent(username)}&password_hash=eq.${hash}&aktif=eq.true&select=id,username,nama_lengkap,role`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      }
    });
    const data = await res.json();
    if (data.length > 0) {
      // Simpan session lalu redirect
      localStorage.setItem('adminUser', JSON.stringify(data[0]));
      redirectByRole(data[0].role);
    } else {
      errEl.textContent = 'Username atau password salah.';
      errEl.classList.add('show');
    }
  } catch {
    errEl.textContent = 'Gagal terhubung ke server.';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Masuk';
  }
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

const style = document.createElement('style');
style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
document.head.appendChild(style);
</script>

<script>
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;

  const DOT_COLOR   = 'rgba(100,170,255,';
  const LINE_COLOR  = 'rgba(80,150,240,';
  const BG_COLOR    = '#0c1e3c';
  const COUNT       = 70;
  const MAX_DIST    = 130;
  const SPEED       = 0.35;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkP() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * SPEED,
      vy: (Math.random() - 0.5) * SPEED,
      r: Math.random() * 1.2 + 0.6
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: COUNT }, mkP);
  }

  function draw() {
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = DOT_COLOR + '0.7)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < MAX_DIST) {
          const alpha = (1 - d / MAX_DIST) * 0.35;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = LINE_COLOR + alpha + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  draw();
})();
</script>
</body>
</html>
