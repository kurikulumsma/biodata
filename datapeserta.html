<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Peserta – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1A5FB4; --blue-dark: #0D4A96; --blue-mid: #2563EB; --blue-light: #EEF4FF; --blue-faint: #F5F8FF;
  --red: #C0392B; --red-light: #FEF2F2;
  --green: #16A34A; --green-light: #F0FDF4;
  --amber: #B45309; --amber-light: #FFFBEB;
  --gray-bg: #F1F3F7; --gray-border: #E2E5ED; --gray-text: #6B7280; --gray-mid: #9CA3AF;
  --text: #111827; --text-soft: #374151; --white: #FFFFFF;
  --sidebar-w: 230px; --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07); --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-bg); color: var(--text); min-height: 100vh; font-size: 14px; visibility: hidden; }


/* ─── APP SHELL ─── */
.app { display: none; min-height: 100vh; }
.app.visible { display: flex; }

/* ─── SIDEBAR OVERLAY (mobile) ─── */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
.sidebar-overlay.show { display: block; }

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-border);
  display: flex; flex-direction: column; min-height: 100vh;
  position: fixed; top: 0; left: 0; z-index: 100;
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.sidebar-brand { padding: 14px 16px 12px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; gap: 10px; }
.sidebar-close-btn { display: none; width: 28px; height: 28px; border: none; background: none; cursor: pointer; border-radius: 6px; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar-close-btn svg { width: 16px; height: 16px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; }
.sidebar-close-btn:hover { background: var(--gray-bg); }
.sidebar-section { padding: 16px 12px 8px; }
.sidebar-section-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray-mid); text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text-soft); transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: inherit; text-decoration: none; }
a.nav-item { display: flex; }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.6; transition: opacity 0.15s; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--blue-faint); color: var(--blue); }
.nav-item:hover svg { opacity: 1; }
.nav-item.active { background: var(--blue-light); color: var(--blue); }
.nav-item.active svg { opacity: 1; }
.sidebar-footer { margin-top: auto; padding: 14px 12px; border-top: 1px solid var(--gray-border); }
.user-card { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--radius); background: var(--gray-bg); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-avatar svg { width: 16px; height: 16px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--gray-text); font-weight: 500; }
.btn-logout-icon { width: 28px; height: 28px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; }
.btn-logout-icon:hover { background: #FEE2E2; }
.btn-logout-icon svg { width: 15px; height: 15px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-logout-icon:hover svg { stroke: var(--red); }

/* ─── MAIN CONTENT ─── */
.content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; min-width: 0; }
.topbar { background: var(--white); border-bottom: 1px solid var(--gray-border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; gap: 12px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.hamburger { display: none; width: 36px; height: 36px; border: none; background: none; cursor: pointer; border-radius: var(--radius); align-items: center; justify-content: center; flex-shrink: 0; }
.hamburger:hover { background: var(--gray-bg); }
.hamburger svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }
.role-badge { font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.03em; white-space: nowrap; }
.role-badge.administrator { background: #EEF4FF; color: var(--blue); border: 1px solid #C5D8F5; }
.role-badge.operator { background: var(--green-light); color: var(--green); border: 1px solid #BBF7D0; }
.role-badge.keuangan { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }
.page { padding: 24px 20px 64px; }

/* ─── FILTER BAR ─── */
.filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.badge-count { background: var(--blue-light); color: var(--blue); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }

/* ─── TABLE ─── */
.table-outer { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--gray-border); box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; background: var(--white); font-size: 13px; }
thead tr { background: #F8FAFC; border-bottom: 1.5px solid var(--gray-border); }
thead th { padding: 0; text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gray-text); white-space: nowrap; position: relative; user-select: none; }
thead th:first-child .th-inner { padding-left: 18px; }
.th-inner { display: flex; align-items: center; gap: 4px; padding: 10px 12px; }
tbody tr { border-bottom: 1px solid #F1F3F7; transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--blue-faint); }
tbody td { padding: 10px 12px; color: var(--text-soft); vertical-align: middle; white-space: nowrap; }
tbody td:first-child { padding-left: 18px; font-weight: 600; color: var(--text); }
.td-empty, .td-loading { padding: 40px; text-align: center; color: var(--gray-text); font-size: 13.5px; white-space: normal; }
.td-ts { font-size: 11.5px; color: var(--gray-mid); white-space: nowrap; }
.td-truncate { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; position: relative; }
.td-truncate[title]:hover::after {
  content: attr(title);
  position: absolute; left: 0; top: calc(100% + 4px); z-index: 999;
  background: #1e293b; color: white; font-size: 12px; line-height: 1.5;
  padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  max-width: 320px; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none;
}

/* ─── ACTION BUTTONS ─── */
.td-actions { display: flex; gap: 2px; align-items: center; }
.icon-btn { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn:hover { background: #FEE2E2; }
.icon-btn svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover svg { stroke: var(--red); }
.icon-btn-info { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn-info:hover { background: var(--blue-light); }
.icon-btn-info svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn-info:hover svg { stroke: var(--blue); }
.icon-btn-riwayat { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn-riwayat:hover { background: var(--amber-light); }
.icon-btn-riwayat svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn-riwayat:hover svg { stroke: var(--amber); }

/* ─── MODAL DETAIL ─── */
.modal-detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
.modal-detail-overlay.show { display: flex; }
.modal-detail { background: var(--white); border-radius: 16px; width: 100%; max-width: 520px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal-detail-header { padding: 18px 22px 14px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-detail-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
.modal-detail-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.modal-detail-close:hover { background: var(--gray-bg); }
.modal-detail-close svg { width: 16px; height: 16px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; }
.modal-detail-body { padding: 18px 22px; overflow-y: auto; }
.detail-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F1F3F7; font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-label { width: 180px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.03em; padding-top: 1px; }
.detail-value { flex: 1; color: var(--text); font-weight: 500; line-height: 1.5; word-break: break-word; }
.btn-secondary { height: 40px; background: var(--white); color: var(--text-soft); border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 18px; transition: all 0.15s; }
.btn-secondary:hover { border-color: #9CA3AF; }

/* ─── MODAL RIWAYAT ─── */
.modal-riwayat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
.modal-riwayat-overlay.show { display: flex; }
.modal-riwayat { background: var(--white); border-radius: 16px; width: 100%; max-width: 480px; max-height: 75vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal-riwayat-header { padding: 18px 22px 14px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-riwayat-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
.modal-riwayat-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.modal-riwayat-close:hover { background: var(--gray-bg); }
.modal-riwayat-close svg { width: 16px; height: 16px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; }
.modal-riwayat-body { padding: 16px 22px; overflow-y: auto; }
.riwayat-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F1F3F7; }
.riwayat-item:last-child { border-bottom: none; }
.riwayat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex-shrink: 0; margin-top: 5px; }
.riwayat-nama { font-size: 13px; font-weight: 600; color: var(--text); }
.riwayat-ts { font-size: 11.5px; color: var(--gray-text); margin-top: 2px; }
.loading-state { text-align: center; padding: 32px; color: var(--gray-text); font-size: 13.5px; }

/* ─── CONFIRM ─── */
.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--white); border-radius: 14px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.confirm-box-header { padding: 22px 24px 14px; }
.confirm-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--red-light); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.confirm-icon svg { width: 22px; height: 22px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.confirm-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.confirm-msg { font-size: 13px; color: var(--gray-text); line-height: 1.6; }
.confirm-footer { padding: 14px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; }
.btn-confirm-cancel { height: 38px; background: var(--white); color: var(--text-soft); border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 18px; }
.btn-confirm-cancel:hover { border-color: #9CA3AF; }
.btn-confirm-ok { height: 38px; background: var(--red); color: white; border: none; border-radius: var(--radius); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 0 18px; }
.btn-confirm-ok:hover { background: #A93226; }

/* ─── TOAST ─── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 999; max-width: 320px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ─── LOGOUT MOBILE ─── */
.btn-logout-mobile { display: none; height: 34px; padding: 0 12px; background: none; border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; }
.btn-logout-mobile:hover { background: #FEE2E2; border-color: #FECACA; color: var(--red); }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  .sidebar-close-btn { display: flex; }
  .hamburger { display: flex; }
  .content { margin-left: 0; }
  .topbar { padding: 12px 16px; }
  .page { padding: 16px 14px 64px; }
  .toast { bottom: 16px; right: 16px; left: 16px; max-width: none; text-align: center; }
  .btn-logout-mobile { display: flex; }
}
@media (max-width: 480px) {
  .role-badge { display: none; }
}
</style>
</head>
<body>

<!-- ─── APP ─── -->
<div class="app" id="app">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logosma.png" alt="Logo SMA" style="height:36px;width:auto;object-fit:contain;flex:1;min-width:0;">
      <button class="sidebar-close-btn" onclick="closeSidebar()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Menu</div>

      <a class="nav-item" href="admin.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Kegiatan
      </a>

      <a class="nav-item active" href="datapeserta.html">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Database Peserta
      </a>

      <a class="nav-item" href="kontak.html">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Cari Kontak
      </a>

      <a class="nav-item" id="navPengaturan" href="pengaturan.html" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Pengaturan
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="user-info">
          <div class="user-name" id="sidebarUserName">-</div>
          <div class="user-role" id="sidebarUserRole">-</div>
        </div>
        <button class="btn-logout-icon" onclick="doLogout()" title="Keluar">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="openSidebar()">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title">Database Peserta</div>
      </div>
      <div class="topbar-right">
        <span class="role-badge" id="roleBadge">-</span>
        <button class="btn-logout-mobile" onclick="doLogout()">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </button>
      </div>
    </div>

    <div class="page">
      <div class="filter-bar">
        <input type="text" id="searchPeserta" placeholder="Cari nama peserta..." oninput="applyTableFilters()" style="height:38px;border:1.5px solid var(--gray-border);border-radius:var(--radius);padding:0 13px;font-family:inherit;font-size:13px;background:var(--white);min-width:260px;color:var(--text);transition:border-color 0.15s;outline:none;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--gray-border)'">
        <span class="badge-count" id="badgePeserta">0</span>
      </div>

      <div class="table-outer" id="pesertaTableOuter">
        <table id="pesertaTable">
          <thead>
            <tr id="pesertaTableHead"></tr>
          </thead>
          <tbody id="pesertaTbody">
            <tr><td colspan="16" class="td-loading">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ─── MODAL DETAIL ─── -->
<div class="modal-detail-overlay" id="modalDetailOverlay" onclick="if(event.target===this)tutupDetailPesertaModal()">
  <div class="modal-detail">
    <div class="modal-detail-header">
      <h3 id="modalDetailNama">Detail Peserta</h3>

      </button>
    </div>
    <div class="modal-detail-body" id="modalDetailBody"></div>
    <div style="padding:14px 22px 18px;border-top:1px solid var(--gray-border);display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-secondary" onclick="tutupDetailPesertaModal()">Tutup</button>
    </div>
  </div>
</div>

<!-- ─── MODAL RIWAYAT ─── -->
<div class="modal-riwayat-overlay" id="modalRiwayatOverlay" onclick="if(event.target===this)closeRiwayatKegiatan()">
  <div class="modal-riwayat">
    <div class="modal-riwayat-header">
      <h3 id="modalRiwayatNama">Riwayat Kegiatan</h3>
      <button class="modal-riwayat-close" onclick="closeRiwayatKegiatan()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-riwayat-body" id="modalRiwayatBody">
      <div class="loading-state">Memuat...</div>

  </div>
</div>

<!-- ─── CONFIRM ─── -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-box-header">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </div>
      <div class="confirm-title" id="confirmTitle">Konfirmasi</div>
      <div class="confirm-msg" id="confirmMsg"></div>
    </div>
    <div class="confirm-footer">
      <button class="btn-confirm-cancel" onclick="confirmResolve(false)">Batal</button>
      <button class="btn-confirm-ok" onclick="confirmResolve(true)">Hapus</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───
const SUPABASE_URL = 'https://lusytejskqevwyyffeue.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1c3l0ZWpza3Fldnd5eWZmZXVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzUyODksImV4cCI6MjA5MTcxMTI4OX0.LKCfdnlB8TQTeB7NuZ1DXwSkCI9DK3WlD4xk-jzUTPU';

// ─── STATE ───
let currentUser = null;
let allPeserta = [];

// ─── SUPABASE HELPER ───
const sb = (path, opts = {}) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
  headers: {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation',
    ...(opts.headers || {})
  },
  ...opts
});

// ─── SHA-256 ───
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ─── INIT ───
window.onload = () => {
  const saved = sessionStorage.getItem('adminUser');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      // sembunyikan kontak untuk keuangan
      const navKontak = document.querySelector('a.nav-item[href="kontak.html"]');
      if (navKontak) navKontak.style.display = currentUser.role === 'keuangan' ? 'none' : 'flex';
      showApp();
    } catch { sessionStorage.clear(); window.location.href = 'login.html'; }
  } else {
    window.location.href = 'login.html';
  }
  document.body.style.visibility = 'visible';
};



function doLogout() {
  sessionStorage.clear();
  window.location.href = 'login.html';
}

function showApp() {
  
  document.getElementById('app').classList.add('visible');
  document.getElementById('sidebarUserName').textContent = currentUser.nama_lengkap || currentUser.username;
  const roleLabels = { administrator: 'Administrator', operator: 'Operator', keuangan: 'Keuangan' };
  document.getElementById('sidebarUserRole').textContent = roleLabels[currentUser.role] || currentUser.role;
  const rb = document.getElementById('roleBadge');
  rb.textContent = roleLabels[currentUser.role] || currentUser.role;
  rb.className = 'role-badge ' + currentUser.role;
  document.getElementById('navPengaturan').style.display = currentUser.role === 'administrator' ? 'flex' : 'none';
  loadPeserta();
}

// ─── SIDEBAR MOBILE ───
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ─── KOLOM TABEL ───
const TABLE_COLS = [
  { key: 'created_at',    label: 'Timestamp' },
  { key: 'nama',          label: 'Nama Lengkap' },
  { key: 'nip',           label: 'NIP' },
  { key: 'golongan',      label: 'Pangkat/Golongan' },
  { key: 'nik',           label: 'NIK' },
  { key: 'mapel',         label: 'Mata Pelajaran yang Diampu' },
  { key: 'instansi',      label: 'Instansi/Unit Kerja' },
  { key: 'jabatan',       label: 'Jabatan' },
  { key: 'wa',            label: 'Nomor Telepon (WhatsApp)' },
  { key: 'provinsi',      label: 'Provinsi' },
  { key: 'kabkota',       label: 'Kabupaten/Kota' },
  { key: 'alamat',        label: 'Alamat Instansi/Unit Kerja' },
  { key: 'telp_instansi', label: 'No Telepon Instansi/Unit Kerja' },
];

function renderTableHeader() {
  const tr = document.getElementById('pesertaTableHead');
  tr.innerHTML = TABLE_COLS.map(col => `
    <th><div class="th-inner"><span>${col.label}</span></div></th>
  `).join('') + '<th style="width:44px"></th>';
}

// ─── LOAD & RENDER PESERTA ───
async function loadPeserta() {
  const tbody = document.getElementById('pesertaTbody');
  tbody.innerHTML = '<tr><td colspan="16" class="td-loading">Memuat data...</td></tr>';
  try {
    const res = await sb('peserta?order=created_at.desc');
    const data = await res.json();
    allPeserta = data;
    renderTableHeader();
    applyTableFilters();
  } catch {
    tbody.innerHTML = '<tr><td colspan="16" class="td-loading">Gagal memuat data peserta.</td></tr>';
  }
}

function applyTableFilters() {
  const q = (document.getElementById('searchPeserta')?.value || '').trim().toLowerCase();
  const items = q ? allPeserta.filter(p => (p.nama || '').toLowerCase().includes(q)) : [...allPeserta];
  document.getElementById('badgePeserta').textContent = items.length;
  renderPeserta(items);
}

function formatTs(ts) {
  if (!ts) return '-';
  try {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch { return ts; }
}

function renderPeserta(items) {
  const tbody = document.getElementById('pesertaTbody');
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="16" class="td-empty">Belum ada peserta terdaftar.</td></tr>`;
    return;
  }
  const isAdmin = currentUser && currentUser.role === 'administrator';
  function tdTrunc(val, maxW) {
    const v = val || '-';
    return `<td class="td-truncate" style="max-width:${maxW}px" title="${escHtml(v)}">${escHtml(v)}</td>`;
  }
  tbody.innerHTML = items.map(item => `
    <tr>
      <td class="td-ts">${escHtml(formatTs(item.created_at))}</td>
      <td>${escHtml(item.nama || '-')}</td>
      <td>${escHtml(item.nip || '-')}</td>
      <td>${escHtml(item.golongan || '-')}</td>
      <td>${escHtml(item.nik || '-')}</td>
      ${tdTrunc(item.mapel, 140)}
      ${tdTrunc(item.instansi, 180)}
      ${tdTrunc(item.jabatan, 140)}
      <td>${escHtml(item.wa || '-')}</td>
      <td>${escHtml(item.provinsi || '-')}</td>
      <td>${escHtml(item.kabkota || '-')}</td>
      ${tdTrunc(item.alamat, 180)}
      ${tdTrunc(item.telp_instansi, 120)}
      <td>
        <div class="td-actions">
          <button class="icon-btn-info" title="Lihat detail peserta" onclick='showDetailPeserta(${JSON.stringify(item)})'>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </button>
          <button class="icon-btn-riwayat" title="Riwayat kegiatan peserta" onclick='showRiwayatKegiatan(${item.id}, \`${escHtml(item.nama || '')}\`)'>
            <svg viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          ${isAdmin ? `<button class="icon-btn" onclick="hapusPeserta(${item.id}, \`${escHtml(item.nama || '')}\`)" title="Hapus peserta">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');
}

async function hapusPeserta(id, nama) {
  const ok = await showConfirm('Hapus Peserta', `Hapus data peserta "<strong>${escHtml(nama)}</strong>"? Tindakan ini tidak bisa dibatalkan.`);
  if (!ok) return;
  try {
    const res = await sb(`peserta?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    if (res.ok) { showToast('Data peserta dihapus.', 'success'); loadPeserta(); }
    else showToast('Gagal hapus peserta.', 'error');
  } catch { showToast('Gagal terhubung ke Supabase.', 'error'); }
}

// ─── MODAL DETAIL ───
function tutupDetailPesertaModal() {
  document.getElementById('modalDetailOverlay').classList.remove('show');
}

function showDetailPeserta(p) {
  const LABELS = [
    ['nama','Nama Lengkap'],['nip','NIP'],['golongan','Pangkat/Golongan'],
    ['nik','NIK'],['mapel','Mata Pelajaran'],['instansi','Instansi/Unit Kerja'],
    ['jabatan','Jabatan'],['wa','No. WhatsApp'],['provinsi','Provinsi'],
    ['kabkota','Kabupaten/Kota'],['alamat','Alamat Instansi'],['telp_instansi','Telepon Instansi']
  ];
  const rows = LABELS.map(([k,l]) => `
    <div class="detail-row">
      <div class="detail-label">${l}</div>
      <div class="detail-value">${escHtml(p[k] || '-')}</div>
    </div>`).join('');
  document.getElementById('modalDetailNama').textContent = p.nama || 'Detail Peserta';
  document.getElementById('modalDetailBody').innerHTML = rows;
  document.getElementById('modalDetailOverlay').classList.add('show');
}

// ─── MODAL RIWAYAT ───
function closeRiwayatKegiatan() {
  document.getElementById('modalRiwayatOverlay').classList.remove('show');
}

async function showRiwayatKegiatan(pesertaId, namaPeserta) {
  document.getElementById('modalRiwayatNama').textContent = 'Riwayat Kegiatan: ' + namaPeserta;
  document.getElementById('modalRiwayatBody').innerHTML = '<div class="loading-state">Memuat...</div>';
  document.getElementById('modalRiwayatOverlay').classList.add('show');
  try {
    const res = await sb(`kegiatan_peserta?peserta_id=eq.${pesertaId}&select=created_at,kegiatan(nama_kegiatan,lokasi)&order=created_at.desc`);
    const data = await res.json();
    if (!data.length) {
      document.getElementById('modalRiwayatBody').innerHTML = '<p style="font-size:13px;color:var(--gray-text);text-align:center;padding:24px 0;">Peserta belum terdaftar di kegiatan manapun.</p>';
      return;
    }
    document.getElementById('modalRiwayatBody').innerHTML = data.map(row => {
      const k = row.kegiatan || {};
      return `<div class="riwayat-item">
        <div class="riwayat-dot"></div>
        <div>
          <div class="riwayat-nama">${escHtml(k.nama_kegiatan || '-')}</div>
          <div class="riwayat-ts">${escHtml(k.lokasi || '')}${k.lokasi ? ' · ' : ''}${escHtml(formatTs(row.created_at))}</div>
        </div>
      </div>`;
    }).join('');
  } catch {
    document.getElementById('modalRiwayatBody').innerHTML = '<div class="loading-state">Gagal memuat data.</div>';
  }
}

// ─── UTILITIES ───
let confirmResolve = () => {};
function showConfirm(title, msg) {
  return new Promise(resolve => {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').innerHTML = msg;
    document.getElementById('confirmOverlay').classList.add('show');
    confirmResolve = (val) => {
      document.getElementById('confirmOverlay').classList.remove('show');
      resolve(val);
    };
  });
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

</script>
