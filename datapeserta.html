<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Peserta – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1A5FB4; --blue-dark: #0D4A96; --blue-mid: #2563EB; --blue-light: #EEF4FF; --blue-faint: #F5F8FF;
  --red: #C0392B; --red-light: #FEF2F2;
  --green: #16A34A; --green-light: #F0FDF4;
  --amber: #B45309; --amber-light: #FFFBEB;
  --gray-bg: #F1F3F7; --gray-border: #E2E5ED; --gray-text: #6B7280; --gray-mid: #9CA3AF;
  --text: #111827; --text-soft: #374151; --white: #FFFFFF;
  --sidebar-w: 230px; --radius: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07); --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-bg); color: var(--text); min-height: 100vh; font-size: 14px; visibility: hidden; }


/* ─── APP SHELL ─── */
.app { display: none; min-height: 100vh; }
.app.visible { display: flex; }

/* ─── SIDEBAR OVERLAY (mobile) ─── */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
.sidebar-overlay.show { display: block; }

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-border);
  display: flex; flex-direction: column; min-height: 100vh;
  position: fixed; top: 0; left: 0; z-index: 100;
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.sidebar-brand { padding: 14px 16px 12px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; gap: 10px; }
.sidebar-close-btn { display: none; width: 28px; height: 28px; border: none; background: none; cursor: pointer; border-radius: 6px; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar-close-btn svg { width: 16px; height: 16px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; }
.sidebar-close-btn:hover { background: var(--gray-bg); }
.sidebar-section { padding: 16px 12px 8px; }
.sidebar-section-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray-mid); text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--text-soft); transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: inherit; text-decoration: none; }
a.nav-item { display: flex; }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.6; transition: opacity 0.15s; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--blue-faint); color: var(--blue); }
.nav-item:hover svg { opacity: 1; }
.nav-item.active { background: var(--blue-light); color: var(--blue); }
.nav-item.active svg { opacity: 1; }
.sidebar-footer { margin-top: auto; padding: 14px 12px; border-top: 1px solid var(--gray-border); }
.user-card { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--radius); background: var(--gray-bg); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.user-avatar svg { width: 16px; height: 16px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--gray-text); font-weight: 500; }
.btn-logout-icon { width: 28px; height: 28px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; }
.btn-logout-icon:hover { background: #FEE2E2; }
.btn-logout-icon svg { width: 15px; height: 15px; stroke: var(--gray-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-logout-icon:hover svg { stroke: var(--red); }

/* ─── MAIN CONTENT ─── */
.content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; min-width: 0; }
.topbar { background: var(--white); border-bottom: 1px solid var(--gray-border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; gap: 12px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.hamburger { display: none; width: 36px; height: 36px; border: none; background: none; cursor: pointer; border-radius: var(--radius); align-items: center; justify-content: center; flex-shrink: 0; }
.hamburger:hover { background: var(--gray-bg); }
.hamburger svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }
.role-badge { font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.03em; white-space: nowrap; }
.role-badge.administrator { background: #EEF4FF; color: var(--blue); border: 1px solid #C5D8F5; }
.role-badge.operator { background: var(--green-light); color: var(--green); border: 1px solid #BBF7D0; }
.role-badge.keuangan { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }
.page { padding: 24px 20px 64px; }

/* ─── FILTER BAR ─── */
.filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.filter-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-unduh-excel { height: 38px; padding: 0 14px; background: var(--white); border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--green); cursor: pointer; display: flex; align-items: center; gap: 7px; transition: all 0.15s; white-space: nowrap; }
.btn-unduh-excel:hover { background: var(--green-light); border-color: #86EFAC; }
.btn-unduh-excel svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.badge-count { background: var(--blue-light); color: var(--blue); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }

/* ─── SYNC BADGE (timestamp) ─── */
.sync-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-light); border: 1px solid #C5D8F5; border-radius: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.sync-badge svg { width: 11px; height: 11px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

/* ─── PAGINATION ─── */
.pagination-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--white); border-top: 1px solid var(--gray-border); border-radius: 0 0 var(--radius-lg) var(--radius-lg); flex-wrap: wrap; }
.pagination-info { font-size: 12.5px; color: var(--gray-text); white-space: nowrap; }
.pagination-nav { display: flex; align-items: center; gap: 4px; }
.pg-btn { height: 32px; min-width: 32px; padding: 0 8px; border: 1.5px solid var(--gray-border); background: var(--white); border-radius: 6px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.15s; white-space: nowrap; }
.pg-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn.active { background: var(--blue); border-color: var(--blue); color: white; }
.pg-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ─── TABLE ─── */
.table-outer { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--gray-border); box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; background: var(--white); font-size: 13px; }
thead tr { background: #F8FAFC; border-bottom: 1.5px solid var(--gray-border); }
thead th { padding: 0; text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gray-text); white-space: nowrap; position: relative; user-select: none; }
thead th:first-child .th-inner { padding-left: 18px; }
.th-inner { display: flex; align-items: center; gap: 4px; padding: 10px 12px; }
tbody tr { border-bottom: 1px solid #F1F3F7; transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--blue-faint); cursor: pointer; }
tbody td { padding: 10px 12px; color: var(--text-soft); vertical-align: middle; white-space: nowrap; }
tbody td:first-child { padding-left: 18px; font-weight: 600; color: var(--text); }
.td-empty, .td-loading { padding: 40px; text-align: center; color: var(--gray-text); font-size: 13.5px; white-space: normal; }
.td-ts { font-size: 11.5px; color: var(--gray-mid); white-space: nowrap; }
.td-truncate { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; position: relative; }
.td-truncate[title]:hover::after {
  content: attr(title);
  position: absolute; left: 0; top: calc(100% + 4px); z-index: 999;
  background: #1e293b; color: white; font-size: 12px; line-height: 1.5;
  padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  max-width: 320px; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none;
}

/* ─── ACTION BUTTONS ─── */
.td-actions { display: flex; gap: 2px; align-items: center; }
.icon-btn { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn:hover { background: #FEE2E2; }
.icon-btn svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover svg { stroke: var(--red); }
.icon-btn-info { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn-info:hover { background: var(--blue-light); }
.icon-btn-info svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn-info:hover svg { stroke: var(--blue); }
.icon-btn-riwayat { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.icon-btn-riwayat:hover { background: var(--amber-light); }
.icon-btn-riwayat svg { width: 15px; height: 15px; stroke: var(--gray-mid); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn-riwayat:hover svg { stroke: var(--amber); }

/* ─── MODAL PESERTA (unified detail + riwayat) ─── */
.modal-peserta-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(3px);
}
.modal-peserta-overlay.show { display: flex; }
.modal-peserta {
  background: var(--white); border-radius: 20px; width: 100%; max-width: 560px;
  max-height: 88vh; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06);
  animation: modalIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* hero header */
.mp-header {
  background: linear-gradient(135deg, var(--blue) 0%, #2563EB 100%);
  padding: 20px 22px 0; flex-shrink: 0; position: relative;
}
.mp-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.mp-avatar {
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.mp-avatar svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mp-title-wrap { flex: 1; min-width: 0; }
.mp-nama { font-size: 15px; font-weight: 800; color: white; line-height: 1.3; word-break: break-word; }
.mp-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 3px; font-weight: 500; }
.mp-close {
  width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.15);
  cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.mp-close:hover { background: rgba(255,255,255,0.3); }
.mp-close svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* tab bar inside header */
.mp-tabs { display: flex; gap: 2px; }
.mp-tab {
  padding: 9px 16px 10px; border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,0.65);
  border-radius: 10px 10px 0 0; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.mp-tab svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
.mp-tab:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.1); }
.mp-tab.active { color: var(--blue); background: var(--white); }
.mp-tab.active svg { opacity: 1; }

/* tab panels */
.mp-body { overflow-y: auto; flex: 1; }
.mp-panel { display: none; }
.mp-panel.active { display: block; }

/* detail panel */
.mp-detail-grid { padding: 6px 0; }
.detail-group { padding: 0 22px; }
.detail-group-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gray-mid); padding: 14px 0 6px;
}
.detail-row-new {
  display: grid; grid-template-columns: 148px 1fr; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid #F1F3F7; align-items: start;
}
.detail-row-new:last-child { border-bottom: none; }
.detail-label-new { font-size: 11.5px; font-weight: 600; color: var(--gray-text); padding-top: 1px; }
.detail-value-new { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.5; word-break: break-word; }
.detail-value-new.empty { color: var(--gray-mid); font-style: italic; }
.detail-section-divider { height: 1px; background: var(--gray-border); margin: 4px 22px; }

/* riwayat panel */
.mp-riwayat-wrap { padding: 16px 22px; }
.riwayat-timeline { position: relative; }
.riwayat-timeline::before {
  content: ''; position: absolute; left: 11px; top: 6px; bottom: 6px;
  width: 2px; background: var(--gray-border); border-radius: 2px;
}
.riwayat-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0; position: relative;
}
.riwayat-item:last-child { }
.riwayat-dot-wrap { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.riwayat-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--blue);
  border: 2px solid white; box-shadow: 0 0 0 2px var(--blue);
}
.riwayat-card {
  flex: 1; background: var(--blue-faint); border: 1px solid #DBEAFE;
  border-radius: 10px; padding: 10px 14px; min-width: 0;
}
.riwayat-nama { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.riwayat-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.riwayat-lokasi { font-size: 11.5px; color: var(--gray-text); display: flex; align-items: center; gap: 4px; }
.riwayat-lokasi svg { width: 11px; height: 11px; stroke: var(--gray-mid); fill: none; stroke-width: 2; flex-shrink: 0; }
.riwayat-tgl { font-size: 11px; color: var(--gray-mid); background: var(--white); border: 1px solid var(--gray-border); border-radius: 4px; padding: 1px 7px; font-weight: 600; }
.mp-footer {
  padding: 12px 22px; border-top: 1px solid var(--gray-border); flex-shrink: 0;
  display: flex; justify-content: flex-end;
}
.btn-secondary { height: 36px; background: var(--white); color: var(--text-soft); border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 18px; transition: all 0.15s; }
.btn-secondary:hover { border-color: #9CA3AF; }
.loading-state { text-align: center; padding: 32px; color: var(--gray-text); font-size: 13.5px; }

/* ─── MODAL RIWAYAT (legacy — hidden, kept for compat) ─── */
.modal-riwayat-overlay { display: none !important; }
/* ─── MODAL DETAIL (legacy — hidden, kept for compat) ─── */
.modal-detail-overlay { display: none !important; }

/* ─── CONFIRM ─── */
.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--white); border-radius: 14px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.confirm-box-header { padding: 22px 24px 14px; }
.confirm-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--red-light); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.confirm-icon svg { width: 22px; height: 22px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.confirm-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.confirm-msg { font-size: 13px; color: var(--gray-text); line-height: 1.6; }
.confirm-footer { padding: 14px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; }
.btn-confirm-cancel { height: 38px; background: var(--white); color: var(--text-soft); border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 18px; }
.btn-confirm-cancel:hover { border-color: #9CA3AF; }
.btn-confirm-ok { height: 38px; background: var(--red); color: white; border: none; border-radius: var(--radius); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 0 18px; }
.btn-confirm-ok:hover { background: #A93226; }

/* ─── TOAST ─── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 999; max-width: 320px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ─── LOGOUT MOBILE ─── */
.btn-logout-mobile { display: none; height: 34px; padding: 0 12px; background: none; border: 1.5px solid var(--gray-border); border-radius: var(--radius); font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; }
.btn-logout-mobile:hover { background: #FEE2E2; border-color: #FECACA; color: var(--red); }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  .sidebar-close-btn { display: flex; }
  .hamburger { display: flex; }
  .content { margin-left: 0; }
  .topbar { padding: 12px 16px; }
  .page { padding: 16px 14px 64px; }
  .toast { bottom: 16px; right: 16px; left: 16px; max-width: none; text-align: center; }
  .btn-logout-mobile { display: flex; }
}
@media (max-width: 480px) {
  .role-badge { display: none; }
}
</style>
</head>
<body>

<!-- ─── APP ─── -->
<div class="app" id="app">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logosma.png" alt="Logo SMA" style="height:36px;width:auto;object-fit:contain;flex:1;min-width:0;">
      <button class="sidebar-close-btn" onclick="closeSidebar()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-section">

// ─── SHA-256 ───
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function unduhExcel() {
  if (!filteredPeserta.length) { showToast('Tidak ada data untuk diunduh.', 'error'); return; }
  const HEADERS = ['No','Update Terakhir','Nama Lengkap','NIP','Pangkat/Golongan','NIK','Mata Pelajaran','Instansi/Unit Kerja','Jabatan','No. WhatsApp','Email','Provinsi','Kabupaten/Kota','Alamat Instansi','Telepon Instansi'];
  const rows = filteredPeserta.map((p, i) => [
    i+1,
    formatTs(p.created_at), p.nama||'', p.nip||'', p.golongan||'', p.nik||'',
    p.mapel||'', p.instansi||'', p.jabatan||'', p.wa||'', p.email||'',
    p.provinsi||'', p.kabkota||'', p.alamat||'', p.telp_instansi||''
  ]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...rows]);
  // Set lebar kolom otomatis berdasarkan konten
  const colWidths = HEADERS.map((h, ci) => {
    const maxLen = Math.max(h.length, ...rows.map(r => String(r[ci]||'').length));
    return { wch: Math.min(maxLen + 2, 50) };
  });
  ws['!cols'] = colWidths;
  XLSX.utils.book_append_sheet(wb, ws, 'Database Peserta');
  XLSX.writeFile(wb, 'Database Peserta.xlsx');
  showToast('File Excel berhasil diunduh.', 'success');
}

function goToPage(page) {

function formatTs(ts) {
  if (!ts) return '-';
  try {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  } catch { return ts; }
}

function renderPeserta(items) {

      ${tdTrunc(item.instansi, 180)}
      ${tdTrunc(item.jabatan, 140)}
      <td>${escHtml(item.wa || '-')}</td>
      <td>${escHtml(item.email || '-')}</td>
      <td>${escHtml(item.provinsi || '-')}</td>
      <td>${escHtml(item.kabkota || '-')}</td>

      <td>
        <div class="td-actions">

            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');

  renderPagination(items.length, totalPages);
}

function renderPagination(total, totalPages) {
  const paginationWrap = document.getElementById('paginationWrap');
  const paginationInfo = document.getElementById('paginationInfo');
  const paginationNav = document.getElementById('paginationNav');

  if (totalPages <= 1) {
    paginationWrap.style.display = 'none';
    return;
  }
  paginationWrap.style.display = 'flex';
  paginationInfo.textContent = `Halaman ${currentPage} dari ${totalPages.toLocaleString('id')}`;

  let nav = '';
  nav += `<button class="pg-btn" ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>`;

  const pages = getPageRange(currentPage, totalPages);
  pages.forEach(p => {
    if (p === '...') {
      nav += `<span style="display:flex;align-items:center;padding:0 4px;color:var(--gray-mid);font-size:13px;">…</span>`;
    } else {
      nav += `<button class="pg-btn${p===currentPage?' active':''}" onclick="goToPage(${p})">${p}</button>`;
    }
  });

  nav += `<button class="pg-btn" ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>`;

  paginationNav.innerHTML = nav;
}

function getPageRange(current, total) {
  if (total <= 7) return Array.from({length: total}, (_,i) => i+1);
  const result = [];
  if (current <= 4) {
    for (let i = 1; i <= 5; i++) result.push(i);
    result.push('...'); result.push(total);
  } else if (current >= total - 3) {
    result.push(1); result.push('...');
    for (let i = total-4; i <= total; i++) result.push(i);
  } else {
    result.push(1); result.push('...');
    result.push(current-1); result.push(current); result.push(current+1);
    result.push('...'); result.push(total);
  }
  return result;
}

    { label: 'Wilayah', fields: [
      ['Provinsi', p.provinsi],
      ['Kabupaten / Kota', p.kabkota],
    ]},
  ];

  let html = '';
  GROUPS.forEach((g, gi) => {
    if (gi > 0) html += `<div class="detail-section-divider"></div>`;
    html += `<div class="detail-group">
      <div class="detail-group-label">${g.label}</div>`;
    g.fields.forEach(([label, val]) => {
      const empty = !val;
      html += `<div class="detail-row-new">
        <div class="detail-label-new">${label}</div>
        <div class="detail-value-new${empty ? ' empty' : ''}">${escHtml(val || '—')}</div>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('mpDetailGrid').innerHTML = html;
  document.getElementById('mpRiwayatBody').innerHTML = '<div class="loading-state">Memuat...</div>';
  document.getElementById('modalPesertaOverlay').classList.add('show');
}

async function loadRiwayatIntoModal(pesertaId) {
  const body = document.getElementById('mpRiwayatBody');
  body.innerHTML = '<div class="loading-state">Memuat riwayat...</div>';
  try {
    const res = await sb(`kegiatan_peserta?peserta_id=eq.${pesertaId}&select=created_at,kegiatan(nama_kegiatan,lokasi)&order=created_at.desc`);
    const data = await res.json();
    if (!data.length) {
      body.innerHTML = '<p style="font-size:13px;color:var(--gray-text);text-align:center;padding:32px 0;">Peserta belum terdaftar di kegiatan manapun.</p>';
      return;
    }
    body.innerHTML = data.map(row => {
      const k = row.kegiatan || {};
      return `<div class="riwayat-item">
        <div class="riwayat-dot-wrap"><div class="riwayat-dot"></div></div>
        <div class="riwayat-card">
          <div class="riwayat-nama">${escHtml(k.nama_kegiatan || '—')}</div>
          <div class="riwayat-meta">
            ${k.lokasi ? `<div class="riwayat-lokasi">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escHtml(k.lokasi)}
            </div>` : ''}
            <div class="riwayat-tgl">${escHtml(formatTs(row.created_at))}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch {
    body.innerHTML = '<div class="loading-state">Gagal memuat data.</div>';
  }
}

// ─── UTILITIES ───
let confirmResolve = () => {};
function showConfirm(title, msg) {
  return new Promise(resolve => {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').innerHTML = msg;
    document.getElementById('confirmOverlay').classList.add('show');
    confirmResolve = (val) => {
      document.getElementById('confirmOverlay').classList.remove('show');
      resolve(val);
    };
  });
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
