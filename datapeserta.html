<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Peserta – Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:        #0057D9;
  --primary-hover:  #0047B8;
  --primary-light:  #EEF4FF;
  --primary-faint:  #F5F9FF;
  --sb-bg:          #0057D9;
  --success:        #22C55E;
  --success-bg:     #EAFBF1;
  --success-text:   #1D9B52;
  --warning:        #F59E0B;
  --warning-bg:     #FFF7E6;
  --warning-text:   #D48806;
  --danger:         #EF4444;
  --danger-bg:      #FFF1F1;
  --danger-text:    #C0392B;
  --bg:             #F4F7FB;
  --surface:        #FFFFFF;
  --border:         #E6ECF5;
  --border-mid:     #D4DCE8;
  --text:           #1A1F36;
  --text-soft:      #4B5568;
  --text-muted:     #6B7280;
  --text-faint:     #9CA3AF;
  --sidebar-w:      252px;
  --topbar-h:       64px;
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-2xl: 24px;
  --shadow-xs: 0 1px 4px rgba(20,20,40,0.04);
  --shadow-sm: 0 4px 18px rgba(20,20,40,0.06);
  --shadow-md: 0 8px 28px rgba(20,20,40,0.08);
  --shadow-lg: 0 16px 48px rgba(20,20,40,0.12);
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; font-size: 13px;
  line-height: 1.5; visibility: hidden;
}

/* ── APP SHELL ── */
.app { display: none; min-height: 100vh; }
.app.visible { display: flex; }

/* ── SIDEBAR OVERLAY ── */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
.sidebar-overlay.show { display: block; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sb-bg);
  background-image:
    radial-gradient(circle at 10% 85%, rgba(255,255,255,0.07) 0%, transparent 60%),
    radial-gradient(circle at 85% 20%, rgba(255,255,255,0.05) 0%, transparent 55%);
  border-radius: 0 30px 30px 0;
  display: flex; flex-direction: column;
  height: 100%; min-height: 100vh;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 4px 0 32px rgba(0,87,217,0.18);
}
.sidebar-brand {
  padding: 22px 20px 18px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 8px;
}
.sidebar-logo {
  height: 40px; width: auto; object-fit: contain;
  flex-shrink: 0;
}
.sidebar-close-btn {
  display: none; width: 28px; height: 28px;
  border: none; background: rgba(255,255,255,0.1);
  cursor: pointer; border-radius: 8px;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.15s;
}
.sidebar-close-btn:hover { background: rgba(255,255,255,0.2); }
.sidebar-close-btn svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }

.sidebar-nav { padding: 6px 12px; flex: 1; }
.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.4); text-transform: uppercase;
  padding: 0 12px; margin: 4px 0 8px;
}
.nav-item {
  display: flex; align-items: center; gap: 14px;
  height: 44px; padding: 0 14px; border-radius: 16px;
  cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: rgba(255,255,255,0.85);
  transition: all 0.18s ease; margin-bottom: 4px;
  border: none; background: transparent; width: 100%;
  text-align: left; font-family: inherit; text-decoration: none;
}
a.nav-item { display: flex; }
.nav-item svg {
  width: 20px; height: 20px; flex-shrink: 0;
  stroke: currentColor; fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  opacity: 0.75; transition: opacity 0.15s;
}
.nav-item:hover { background: rgba(255,255,255,0.1); color: #FFFFFF; }
.nav-item:hover svg { opacity: 1; }
.nav-item.active { background: #FFFFFF; color: var(--primary); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.nav-item.active svg { opacity: 1; stroke: var(--primary); }

.sidebar-footer { padding: 12px; }
.user-card {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 20px; padding: 16px 18px;
  display: flex; align-items: center; gap: 12px;
}
.user-avatar {
  width: 38px; height: 38px; border-radius: 12px;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.user-avatar svg { width: 18px; height: 18px; stroke: #FFFFFF; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.55); margin-top: 1px; }
.btn-logout-icon {
  width: 34px; height: 34px; border: none;
  background: rgba(255,255,255,0.1); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; transition: background 0.15s; flex-shrink: 0;
}
.btn-logout-icon:hover { background: rgba(239,68,68,0.25); }
.btn-logout-icon svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.7); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-logout-icon:hover svg { stroke: #FECACA; }

/* ── CONTENT ── */
.content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; min-width: 0; }

/* ── TOPBAR ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  height: var(--topbar-h); padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50; gap: 16px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.topbar-title { font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.hamburger {
  display: none; width: 38px; height: 38px;
  border: none; background: none; cursor: pointer;
  border-radius: var(--r-md); align-items: center; justify-content: center; flex-shrink: 0;
}
.hamburger:hover { background: var(--bg); }
.hamburger svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }
.user-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--primary-light); border-radius: 999px;
  padding: 8px 18px 8px 12px; cursor: default;
}
.user-pill-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.user-pill-avatar svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; }
.user-pill-label { font-size: 12.5px; font-weight: 700; color: var(--primary); }
.btn-logout-mobile {
  display: none; height: 36px; padding: 0 14px;
  background: none; border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-family: inherit;
  font-size: 12.5px; font-weight: 700; color: var(--text-soft);
  cursor: pointer; align-items: center; gap: 6px;
  transition: all 0.15s; white-space: nowrap;
}
.btn-logout-mobile:hover { background: var(--danger-bg); border-color: #FECACA; color: var(--danger); }

/* ── PAGE ── */
.page { padding: 22px 22px 48px; }

/* ── FILTER BAR ── */
.filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; width: 100%; }
.filter-select {
  height: 40px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); padding: 0 12px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  background: var(--surface); color: var(--text);
  transition: border-color 0.15s; outline: none; cursor: pointer;
  flex: 1 1 150px; min-width: 130px; max-width: 220px;
}
.filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,87,217,0.08); }
.search-wrap { position: relative; flex: 2 1 220px; min-width: 200px; }
.search-wrap input {
  height: 40px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); padding: 0 14px 0 38px;
  font-family: inherit; font-size: 13px;
  background: var(--surface); color: var(--text);
  transition: border-color 0.15s; outline: none; width: 100%;
}
.search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,87,217,0.08); }
.search-wrap svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; stroke: var(--text-faint);
  fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none;
}
.icon-btn-reset {
  height: 40px; width: 40px; flex-shrink: 0;
  border: 1.5px solid var(--border); background: var(--surface);
  border-radius: var(--r-md); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.icon-btn-reset:hover { border-color: var(--primary); background: var(--primary-light); }
.icon-btn-reset svg { width: 16px; height: 16px; stroke: var(--text-soft); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn-reset:hover svg { stroke: var(--primary); }
.filter-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-unduh-excel {
  height: 38px; padding: 0 16px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--success-text);
  cursor: pointer; display: flex; align-items: center; gap: 7px;
  transition: all 0.15s; white-space: nowrap;
}
.btn-unduh-excel:hover { background: var(--success-bg); border-color: #86EFAC; }
.btn-unduh-excel svg { width: 15px; height: 15px; stroke: var(--success-text); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

/* ── PAGINATION ── */
.pagination-wrap {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 16px;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 0 0 var(--r-lg) var(--r-lg); flex-wrap: wrap;
}
.pagination-info { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.pagination-nav { display: flex; align-items: center; gap: 4px; }
.pg-btn {
  height: 32px; min-width: 32px; padding: 0 8px;
  border: 1.5px solid var(--border); background: var(--surface);
  border-radius: 8px; font-family: inherit; font-size: 12.5px;
  font-weight: 600; color: var(--text-soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 4px; transition: all 0.15s; white-space: nowrap;
}
.pg-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
.pg-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* ── TABLE ── */
.table-outer { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13px; }
thead tr { background: #F8FAFC; border-bottom: 1.5px solid var(--border); }
thead th { padding: 0; text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; position: relative; user-select: none; }
thead th:first-child .th-inner { padding-left: 18px; }
.th-inner { display: flex; align-items: center; gap: 4px; padding: 10px 12px; }
tbody tr { border-bottom: 1px solid #F1F3F7; transition: background 0.1s; cursor: pointer; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--primary-faint); }
tbody td { padding: 10px 12px; color: var(--text-soft); vertical-align: middle; white-space: nowrap; }
tbody td:first-child { padding-left: 18px; font-weight: 600; color: var(--text); }
.td-empty, .td-loading { padding: 40px; text-align: center; color: var(--text-muted); font-size: 13.5px; white-space: normal; }
.td-ts { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
.td-truncate { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; position: relative; }
.td-truncate[title]:hover::after {
  content: attr(title); position: absolute; left: 0; top: calc(100% + 4px); z-index: 999;
  background: #1e293b; color: white; font-size: 12px; line-height: 1.5;
  padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  max-width: 320px; min-width: 120px; box-shadow: var(--shadow-md); pointer-events: none;
}
.td-actions { display: flex; gap: 2px; align-items: center; }
.icon-btn {
  width: 30px; height: 30px; border: none; background: none; cursor: pointer;
  border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.icon-btn:hover { background: var(--danger-bg); }
.icon-btn svg { width: 15px; height: 15px; stroke: var(--text-faint); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover svg { stroke: var(--danger); }
.sync-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--primary-light); border: 1px solid #C5D8F5;
  border-radius: 6px; padding: 3px 8px;
  font-size: 11.5px; font-weight: 600; color: var(--primary); white-space: nowrap;
}
.sync-badge svg { width: 11px; height: 11px; stroke: var(--primary); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

/* ── MODAL PESERTA (unified detail + riwayat) ── */
.modal-peserta-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-peserta-overlay.show { display: flex; }
.modal-peserta {
  background: var(--surface); border-radius: 20px; width: 100%; max-width: 540px;
  max-height: 88vh; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.mp-header {
  background: linear-gradient(135deg, var(--primary) 0%, #2563EB 100%);
  padding: 20px 22px 0; flex-shrink: 0;
}
.mp-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.mp-avatar {
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.mp-avatar svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; }
.mp-title-wrap { flex: 1; min-width: 0; }
.mp-nama { font-size: 15px; font-weight: 800; color: white; line-height: 1.3; word-break: break-word; }
.mp-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 3px; font-weight: 500; }
.mp-close {
  width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.15);
  cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.mp-close:hover { background: rgba(255,255,255,0.3); }
.mp-close svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }
.mp-tabs { display: flex; gap: 2px; }
.mp-tab {
  padding: 9px 16px 10px; border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 700;
  color: rgba(255,255,255,0.65); border-radius: 10px 10px 0 0;
  transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.mp-tab svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; opacity: 0.8; }
.mp-tab:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.1); }
.mp-tab.active { color: var(--primary); background: var(--surface); }
.mp-tab.active svg { opacity: 1; }
.mp-body { overflow-y: auto; flex: 1; }
.mp-panel { display: none; }
.mp-panel.active { display: block; }

/* detail panel */
.mp-detail-grid { padding: 6px 0; }
.detail-group { padding: 0 22px; }
.detail-group-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-faint); padding: 14px 0 6px;
}
.detail-row-new {
  display: grid; grid-template-columns: 148px 1fr; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid #F1F3F7; align-items: start;
}
.detail-row-new:last-child { border-bottom: none; }
.detail-label-new { font-size: 11.5px; font-weight: 600; color: var(--text-muted); padding-top: 1px; }
.detail-value-new { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.5; word-break: break-word; }
.detail-value-new.empty { color: var(--text-faint); font-style: italic; }
.detail-section-divider { height: 1px; background: var(--border); margin: 4px 22px; }

/* riwayat panel */
.mp-riwayat-wrap { padding: 16px 22px; }
.riwayat-timeline { position: relative; }
.riwayat-timeline::before {
  content: ''; position: absolute; left: 11px; top: 6px; bottom: 6px;
  width: 2px; background: var(--border); border-radius: 2px;
}
.riwayat-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; position: relative; }
.riwayat-dot-wrap { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.riwayat-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid white; box-shadow: 0 0 0 2px var(--primary); }
.riwayat-card {
  flex: 1; background: var(--primary-faint); border: 1px solid #DBEAFE;
  border-radius: 10px; padding: 10px 14px; min-width: 0;
}
.riwayat-nama { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.riwayat-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.riwayat-lokasi { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.riwayat-lokasi svg { width: 11px; height: 11px; stroke: var(--text-faint); fill: none; stroke-width: 2; flex-shrink: 0; }
.riwayat-tgl { font-size: 11px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-weight: 600; }

.mp-footer {
  padding: 12px 22px; border-top: 1px solid var(--border); flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.btn-secondary {
  height: 36px; background: var(--surface); color: var(--text-soft);
  border: 1.5px solid var(--border); border-radius: var(--r-md);
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 18px;
  transition: all 0.15s;
}
.btn-secondary:hover { border-color: #9CA3AF; }
.btn-hapus-modal {
  height: 36px; padding: 0 16px;
  background: var(--danger-bg); border: 1.5px solid #FECACA;
  border-radius: var(--r-md); font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--danger);
  cursor: pointer; display: flex; align-items: center; gap: 7px;
  transition: all 0.15s;
}
.btn-hapus-modal:hover { background: #FEE2E2; }
.btn-hapus-modal svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* ── CONFIRM ── */
.confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--surface); border-radius: 18px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: var(--shadow-lg); }
.confirm-box-header { padding: 24px 26px 14px; }
.confirm-icon { width: 46px; height: 46px; border-radius: 14px; background: var(--danger-bg); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.confirm-icon svg { width: 22px; height: 22px; stroke: var(--danger); fill: none; stroke-width: 2; stroke-linecap: round; }
.confirm-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.confirm-msg { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.confirm-footer { padding: 14px 26px 22px; display: flex; gap: 10px; justify-content: flex-end; }
.btn-confirm-cancel { height: 40px; background: var(--surface); color: var(--text-soft); border: 1.5px solid var(--border); border-radius: var(--r-md); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0 18px; }
.btn-confirm-cancel:hover { border-color: #9CA3AF; }
.btn-confirm-ok { height: 40px; background: var(--danger); color: white; border: none; border-radius: var(--r-md); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 0 18px; }
.btn-confirm-ok:hover { background: #C0392B; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 28px; right: 28px; background: #1e293b; color: white; padding: 13px 22px; border-radius: var(--r-lg); font-size: 13.5px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; z-index: 999; max-width: 320px; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

.loading-state { text-align: center; padding: 36px; color: var(--text-muted); font-size: 13.5px; }

/* ── SKELETON ── */
@keyframes shimmer {
  0%   { background-position: -600px 0; }
  100% { background-position:  600px 0; }
}
.skeleton {
  background: linear-gradient(90deg, #EEF2F7 25%, #E2E8F0 50%, #EEF2F7 75%);
  background-size: 600px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}
.sk-row td { padding: 12px; }
.sk-row:hover { background: transparent !important; cursor: default; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,87,217,0.2); }
  .sidebar-close-btn { display: flex; }
  .hamburger { display: flex; }
  .content { margin-left: 0; }
  .topbar { padding: 0 16px; }
  .page { padding: 16px 14px 48px; }
  .toast { bottom: 16px; right: 16px; left: 16px; max-width: none; text-align: center; }
  .btn-logout-mobile { display: flex; }
  .user-pill { display: none; }
}
@media (max-width: 480px) {
  .filter-bar { flex-direction: column; align-items: flex-start; }
  .search-wrap { width: 100%; }
  .search-wrap input { min-width: 100%; }
  .filter-select { width: 100%; max-width: none; }
  .filter-bar-right { margin-left: 0; width: 100%; }
  .btn-unduh-excel { width: 100%; justify-content: center; }
}
</style>

<script>
// ─── STATE ───
let allPeserta = [];
let filteredPeserta = [];
let currentPage = 1;
const perPage = 20;
let _currentPesertaId = null;
let _currentPesertaNama = null;

// ─── onAppReady — dipanggil auth.js setelah sesi valid ───
function onAppReady(user) {
  // navPengaturan, navKontak, pillRoleLabel sudah diisi sidebar.js
  const isAdmin = user.role === 'administrator';
  const filterBarRight = document.getElementById('filterBarRight');
  if (filterBarRight) filterBarRight.style.display = isAdmin ? 'flex' : 'none';

  loadPeserta();
}

// ─── LOAD & RENDER ───
const TABLE_COLS = [
  { key: 'updated_at',    label: 'Update Terakhir' },
  { key: 'nama',          label: 'Nama Lengkap' },
  { key: 'nik',           label: 'NIK' },
  { key: 'nip',           label: 'NIP' },
  { key: 'golongan',      label: 'Pangkat/Golongan' },
  { key: 'unsur_peserta', label: 'Unsur Peserta' },
  { key: 'status_kepegawaian', label: 'Status Kepegawaian' },
  { key: 'mapel',         label: 'Mata Pelajaran yang Diampu' },
  { key: 'npsn',          label: 'NPSN' },
  { key: 'instansi',      label: 'Instansi/Unit Kerja' },
  { key: 'jabatan',       label: 'Jabatan' },
  { key: 'wa',            label: 'Nomor Telepon (WhatsApp)' },
  { key: 'email',         label: 'Email' },
  { key: 'provinsi',      label: 'Provinsi' },
  { key: 'kabkota',       label: 'Kabupaten/Kota' },
  { key: 'alamat',        label: 'Alamat Instansi/Unit Kerja' },
  { key: 'telp_instansi', label: 'No Telepon Instansi/Unit Kerja' },
  { key: 'biodata_url',   label: 'Biodata' },
];

function renderTableHeader() {
  const tr = document.getElementById('pesertaTableHead');
  tr.innerHTML = TABLE_COLS.map(col =>
    `<th><div class="th-inner"><span>${col.label}</span></div></th>`
  ).join('') + '<th style="width:44px"></th>';
}

function _skeletonRows(n = 8) {
  const cols = 19; // TABLE_COLS.length + 1 aksi
  return Array.from({length: n}, (_, i) => `
    <tr class="sk-row">
      <td><span class="skeleton" style="display:inline-block;height:20px;width:72px;border-radius:5px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:${100 + (i%3)*40}px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:80px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:60px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:100px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:90px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:70px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:120px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:70px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:120px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:90px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:80px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:100px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:70px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:80px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:110px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:90px;"></span></td>
      <td><span class="skeleton" style="display:inline-block;height:14px;width:60px;"></span></td>
      <td></td>
    </tr>
  `).join('');
}

async function loadPeserta() {
  const tbody = document.getElementById('pesertaTbody');
  renderTableHeader();
  tbody.innerHTML = _skeletonRows(8);
  try {
    const res = await sb('peserta?order=updated_at.desc');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allPeserta = data;
    renderTableHeader();
    populateFilterOptions();
    applyTableFilters();
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="19" class="td-loading">Gagal memuat data peserta.</td></tr>`;
    console.error(e);
  }
}

function populateFilterOptions() {
  const buildOptions = (selectId, values, defaultLabel, useLabelFn) => {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const prevVal = sel.value;
    const unique = [...new Set(values.filter(Boolean))].sort((a,b) => a.localeCompare(b, 'id'));
    sel.innerHTML = `<option value="">${defaultLabel}</option>` + unique.map(v =>
      `<option value="${escHtml(v)}">${escHtml(useLabelFn ? useLabelFn(v) : v)}</option>`
    ).join('');
    if (unique.includes(prevVal)) sel.value = prevVal;
  };
  buildOptions('filterProvinsi', allPeserta.map(p => p.provinsi), 'Semua Provinsi');
  buildOptions('filterKabkota', allPeserta.map(p => p.kabkota), 'Semua Kab/Kota');
  buildOptions('filterUnsur', allPeserta.map(p => p.unsur_peserta), 'Semua Unsur Peserta', labelUnsur);
  buildOptions('filterMapel', allPeserta.map(p => p.mapel), 'Semua Mapel');
}

function applyTableFilters() {
  const q = (document.getElementById('searchPeserta')?.value || '').trim().toLowerCase();
  const fProvinsi = document.getElementById('filterProvinsi')?.value || '';
  const fKabkota = document.getElementById('filterKabkota')?.value || '';
  const fUnsur = document.getElementById('filterUnsur')?.value || '';
  const fMapel = document.getElementById('filterMapel')?.value || '';
  const SEARCH_FIELDS = ['nama','nip','golongan','nik','mapel','npsn','instansi','jabatan','wa','email','provinsi','kabkota','alamat','telp_instansi'];
  filteredPeserta = allPeserta.filter(p => {
    if (fProvinsi && p.provinsi !== fProvinsi) return false;
    if (fKabkota && p.kabkota !== fKabkota) return false;
    if (fUnsur && p.unsur_peserta !== fUnsur) return false;
    if (fMapel && p.mapel !== fMapel) return false;
    if (!q) return true;
    return SEARCH_FIELDS.some(f => (p[f] || '').toString().toLowerCase().includes(q))
      || labelUnsur(p.unsur_peserta).toLowerCase().includes(q)
      || labelStatus(p.status_kepegawaian).toLowerCase().includes(q);
  });
  currentPage = 1;
  renderPeserta(filteredPeserta);
}

function resetTableFilters() {
  document.getElementById('searchPeserta').value = '';
  document.getElementById('filterProvinsi').value = '';
  document.getElementById('filterKabkota').value = '';
  document.getElementById('filterUnsur').value = '';
  document.getElementById('filterMapel').value = '';
  applyTableFilters();
}

function formatTs(ts) {
  if (!ts) return '-';
  try {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  } catch { return ts; }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── LABEL MAPPING (kode Supabase → label enak dibaca) ───
const LABEL_UNSUR_PESERTA = {
  guru_tendik:    'Guru / Tendik Sekolah',
  pengawas:       'Pengawas / Penilik Sekolah',
  dinas:          'Dinas Pendidikan (Provinsi/Kab/Kota)',
  kemendikdasmen: 'Kementerian Pendidikan Dasar dan Menengah',
  kl_lain:        'Kementerian / Lembaga Lain',
  mahasiswa:      'Perguruan Tinggi / Mahasiswa',
  praktisi_swasta:'Praktisi / Swasta / Umum',
};
const LABEL_STATUS_KEPEGAWAIAN = {
  asn_pns:     'ASN / PNS',
  non_asn_pns: 'Non-ASN / PNS',
};
function labelUnsur(v) { return LABEL_UNSUR_PESERTA[v] || v || ''; }
function labelStatus(v) { return LABEL_STATUS_KEPEGAWAIAN[v] || v || ''; }

function renderPeserta(items) {
  const tbody = document.getElementById('pesertaTbody');
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="19" class="td-empty">Belum ada peserta terdaftar.</td></tr>';
    document.getElementById('paginationWrap').style.display = 'none';
    return;
  }
  const totalPages = Math.ceil(items.length / perPage);
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const pageItems = items.slice(start, start + perPage);
  const isAdmin = currentUser && currentUser.role === 'administrator';

  function tdTrunc(val, maxW) {
    const v = val || '-';
    return `<td class="td-truncate" style="max-width:${maxW}px" title="${escHtml(v)}">${escHtml(v)}</td>`;
  }

  tbody.innerHTML = pageItems.map(item => `
    <tr onclick='openPesertaModal(${JSON.stringify(item)})'>
      <td style="white-space:nowrap;">
        <span class="sync-badge">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${escHtml(formatTs(item.updated_at))}
        </span>
      </td>
      <td>${escHtml(item.nama || '-')}</td>
      <td>${escHtml(item.nik || '-')}</td>
      <td>${escHtml(item.nip || '-')}</td>
      <td>${escHtml(item.golongan || '-')}</td>
      <td>${escHtml(labelUnsur(item.unsur_peserta) || '-')}</td>
      <td>${escHtml(labelStatus(item.status_kepegawaian) || '-')}</td>
      ${tdTrunc(item.mapel, 140)}
      <td>${escHtml(item.npsn || '-')}</td>
      ${tdTrunc(item.instansi, 180)}
      ${tdTrunc(item.jabatan, 140)}
      <td>${escHtml(item.wa || '-')}</td>
      <td>${escHtml(item.email || '-')}</td>
      <td>${escHtml(item.provinsi || '-')}</td>
      <td>${escHtml(item.kabkota || '-')}</td>
      ${tdTrunc(item.alamat, 180)}
      ${tdTrunc(item.telp_instansi, 120)}
      <td>${item.biodata_url ? `<a href="${escHtml(item.biodata_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--primary);font-weight:600;text-decoration:none;">Lihat</a>` : '-'}</td>
      <td>
        <div class="td-actions">
          ${isAdmin ? `<button class="icon-btn" title="Hapus peserta" onclick="event.stopPropagation();hapusPeserta(${item.id}, \`${escHtml(item.nama || '')}\`)">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');

  renderPagination(items.length, totalPages);
}

function renderPagination(total, totalPages) {
  const wrap = document.getElementById('paginationWrap');
  if (totalPages <= 1) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  document.getElementById('paginationInfo').textContent = `Halaman ${currentPage} dari ${totalPages.toLocaleString('id')}`;

  let nav = `<button class="pg-btn" ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>`;
  getPageRange(currentPage, totalPages).forEach(p => {
    nav += p === '...'
      ? `<span style="display:flex;align-items:center;padding:0 4px;color:var(--text-faint);font-size:13px;">…</span>`
      : `<button class="pg-btn${p===currentPage?' active':''}" onclick="goToPage(${p})">${p}</button>`;
  });
  nav += `<button class="pg-btn" ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>`;
  document.getElementById('paginationNav').innerHTML = nav;
}

function getPageRange(current, total) {
  if (total <= 7) return Array.from({length: total}, (_,i) => i+1);
  const r = [];
  if (current <= 4) {
    for (let i=1;i<=5;i++) r.push(i); r.push('...'); r.push(total);
  } else if (current >= total - 3) {
    r.push(1); r.push('...');
    for (let i=total-4;i<=total;i++) r.push(i);
  } else {
    r.push(1); r.push('...');
    r.push(current-1); r.push(current); r.push(current+1);
    r.push('...'); r.push(total);
  }
  return r;
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredPeserta.length / perPage);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderPeserta(filteredPeserta);
  document.getElementById('pesertaTableOuter').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── HAPUS ───
async function hapusPeserta(id, nama) {
  const ok = await showConfirm('Hapus Peserta', `Hapus data peserta "<strong>${escHtml(nama)}</strong>"? Tindakan ini tidak bisa dibatalkan.`);
  if (!ok) return;
  try {
    const res = await sb(`peserta?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    if (res.ok) { showToast('Data peserta dihapus.', 'success'); loadPeserta(); }
    else showToast('Gagal hapus peserta.', 'error');
  } catch { showToast('Gagal terhubung ke Supabase.', 'error'); }
}

async function hapusPesertaDariModal() {
  if (!_currentPesertaId) return;
  const id = _currentPesertaId, nama = _currentPesertaNama;
  closePesertaModal();
  await hapusPeserta(id, nama);
}

// ─── UNDUH EXCEL ───
function unduhExcel() {
  if (!filteredPeserta.length) { showToast('Tidak ada data untuk diunduh.', 'error'); return; }
  const HEADERS = ['No','Update Terakhir','Nama Lengkap','NIK','NIP','Pangkat/Golongan','Unsur Peserta','Status Kepegawaian','Mata Pelajaran','NPSN','Instansi/Unit Kerja','Jabatan','No. WhatsApp','Email','Provinsi','Kabupaten/Kota','Alamat Instansi','Telepon Instansi','Biodata'];
  const rows = filteredPeserta.map((p,i) => [
    i+1, formatTs(p.updated_at), p.nama||'', p.nik||'', p.nip||'', p.golongan||'', labelUnsur(p.unsur_peserta)||'', labelStatus(p.status_kepegawaian)||'',
    p.mapel||'', p.npsn||'', p.instansi||'', p.jabatan||'', p.wa||'', p.email||'',
    p.provinsi||'', p.kabkota||'', p.alamat||'', p.telp_instansi||'', p.biodata_url||''
  ]);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...rows]);
  ws['!cols'] = HEADERS.map((h,ci) => ({ wch: Math.min(Math.max(h.length, ...rows.map(r=>String(r[ci]||'').length)) + 2, 50) }));
  XLSX.utils.book_append_sheet(wb, ws, 'Database Peserta');
  XLSX.writeFile(wb, 'Database Peserta.xlsx');
  showToast('File Excel berhasil diunduh.', 'success');
}

// ─── MODAL PESERTA ───
function closePesertaModal() {
  document.getElementById('modalPesertaOverlay').classList.remove('show');
}

function switchTab(tab) {
  document.getElementById('panelDetail').classList.toggle('active', tab === 'detail');
  document.getElementById('panelRiwayat').classList.toggle('active', tab === 'riwayat');
  document.getElementById('tabBtnDetail').classList.toggle('active', tab === 'detail');
  document.getElementById('tabBtnRiwayat').classList.toggle('active', tab === 'riwayat');
  if (tab === 'riwayat' && _currentPesertaId) loadRiwayatIntoModal(_currentPesertaId);
}

function openPesertaModal(p) {
  _currentPesertaId   = p.id;
  _currentPesertaNama = p.nama || '—';

  document.getElementById('mpNama').textContent = p.nama || '—';
  document.getElementById('mpSub').textContent  = [p.jabatan, p.instansi].filter(Boolean).join(' · ') || 'Peserta';

  // Tombol hapus hanya admin
  const isAdmin = currentUser && currentUser.role === 'administrator';
  document.getElementById('btnHapusModal').style.display = isAdmin ? 'flex' : 'none';

  switchTab('detail');

  const GROUPS = [
    { label: 'Identitas', fields: [
      ['Nama Lengkap', p.nama], ['NIK', p.nik], ['NIP', p.nip],
      ['Pangkat / Golongan', p.golongan], ['Unsur Peserta', labelUnsur(p.unsur_peserta)],
      ['Status Kepegawaian', labelStatus(p.status_kepegawaian)],
    ]},
    { label: 'Tugas & Instansi', fields: [
      ['Mata Pelajaran', p.mapel], ['Jabatan', p.jabatan], ['NPSN', p.npsn],
      ['Instansi / Unit Kerja', p.instansi], ['Alamat Instansi', p.alamat],
      ['Telepon Instansi', p.telp_instansi], ['Biodata', p.biodata_url],
    ]},
    { label: 'Kontak Pribadi', fields: [
      ['No. WhatsApp', p.wa], ['Email', p.email],
    ]},
    { label: 'Wilayah', fields: [
      ['Provinsi', p.provinsi], ['Kabupaten / Kota', p.kabkota],
    ]},
  ];

  let html = '';
  GROUPS.forEach((g, gi) => {
    if (gi > 0) html += `<div class="detail-section-divider"></div>`;
    html += `<div class="detail-group"><div class="detail-group-label">${g.label}</div>`;
    g.fields.forEach(([label, val]) => {
      const valHtml = (label === 'Biodata' && val)
        ? `<a href="${escHtml(val)}" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;text-decoration:none;">Lihat Dokumen</a>`
        : escHtml(val || '—');
      html += `<div class="detail-row-new">
        <div class="detail-label-new">${label}</div>
        <div class="detail-value-new${!val ? ' empty' : ''}">${valHtml}</div>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('mpDetailGrid').innerHTML = html;
  document.getElementById('mpRiwayatBody').innerHTML = '<div class="loading-state">Memuat...</div>';
  document.getElementById('modalPesertaOverlay').classList.add('show');
}

async function loadRiwayatIntoModal(pesertaId) {
  const body = document.getElementById('mpRiwayatBody');
  body.innerHTML = '<div class="loading-state">Memuat riwayat...</div>';
  try {
    const res = await sb(`kegiatan_peserta?peserta_id=eq.${pesertaId}&select=created_at,kegiatan(nama_kegiatan,lokasi)&order=created_at.desc`);
    const data = await res.json();
    if (!data.length) {
      body.innerHTML = '<p style="font-size:13px;color:var(--text-muted);text-align:center;padding:32px 0;">Peserta belum terdaftar di kegiatan manapun.</p>';
      return;
    }
    body.innerHTML = data.map(row => {
      const k = row.kegiatan || {};
      return `<div class="riwayat-item">
        <div class="riwayat-dot-wrap"><div class="riwayat-dot"></div></div>
        <div class="riwayat-card">
          <div class="riwayat-nama">${escHtml(k.nama_kegiatan || '—')}</div>
          <div class="riwayat-meta">
            ${k.lokasi ? `<div class="riwayat-lokasi">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escHtml(k.lokasi)}
            </div>` : ''}
            <div class="riwayat-tgl">${escHtml(formatTs(row.created_at))}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch {
    body.innerHTML = '<div class="loading-state">Gagal memuat data.</div>';
  }
}

// ─── UTILITIES ───
let confirmResolve = () => {};
function showConfirm(title, msg) {
  return new Promise(resolve => {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').innerHTML = msg;
    document.getElementById('confirmOverlay').classList.add('show');
    confirmResolve = val => { document.getElementById('confirmOverlay').classList.remove('show'); resolve(val); };
  });
}
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}
